name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
        env:
          CXXFLAGS: "-std=c++20"
      - name: Test
        run: pnpm test:node
      # Build first: the Nuxt UI Vite plugin only writes the complete
      # `components.d.ts` (with U* global component types) during a real
      # build/dev run. `astro sync` writes an incomplete declaration on a
      # fresh checkout, so `vue-tsc` inside `pnpm check` fails unless the
      # build artifacts already exist. See:
      # https://ui.nuxt.com/docs/getting-started/installation/vue#type-declarations
      - name: Build
        run: pnpm build
      - name: Check
        run: pnpm check

