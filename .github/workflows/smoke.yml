name: Smoke Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - renovate/**
  pull_request:
    branches-ignore:
      - renovate/**

jobs:
  smoke:
    name: List test cases
    runs-on: ubuntu-latest
    outputs:
      json-files: ${{ steps.list-data-files.outputs.json-files }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
        env:
          CXXFLAGS: "-std=c++20"
      - id: list-data-files
        name: List all example JSON files
        run: pnpm run smoke list
  for-each-repo:
    name: Repo
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        json-path: ${{ fromJson(needs.smoke.outputs.json-files) }}
    uses: ./.github/workflows/smoke-single.yml
    with:
      json-path: ${{ matrix.json-path }}
