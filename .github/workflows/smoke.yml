name: Smoke Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - renovate/**
  pull_request:
    branches-ignore:
      - renovate/**

jobs:
  smoke:
    name: List test cases
    runs-on: ubuntu-latest
    outputs:
      json-files: ${{ steps.list-data-files.outputs.json-files }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "10.34.5"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        env:
          CXXFLAGS: "-std=c++20"
      - id: list-data-files
        name: List all example JSON files
        run: pnpm run smoke list
  for-each-repo:
    name: Repo
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        json-path: ${{ fromJson(needs.smoke.outputs.json-files) }}
    uses: ./.github/workflows/smoke-single.yml
    with:
      json-path: ${{ matrix.json-path }}
